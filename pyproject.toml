[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f50-sms"
version = "0.1.0"
description = "中兴 F50 随身 WiFi 短信命令行工具：读取、格式化查看与导出"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "F50-Message contributors" }]
keywords = ["zte", "f50", "sms", "ufi", "cli", "随身wifi"]
dependencies = []
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Communications",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
f50sms = "f50_sms.cli:main"

[project.urls]
Homepage = "https://example.invalid/f50-sms"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
